{%extends 'basic/base.html'%}
{%block title%}忘記密碼{%endblock%}
{%block css%}
    <style>
        .recovery-container {
            max-width: 500px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            padding: 30px 40px;
            font-family: 'Inter', sans-serif;
            color: #222;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 1.5rem;
            border: 1.5px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        button.submit-btn {
            width: 100%;
            background-color: #007bff;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button.submit-btn:hover {
            background-color: #0056b3;
        }
    </style>
{%endblock%}
{%block content%}
    <div class="recovery-container" role="main" aria-label="忘記密碼">
        <h2 style="color: #007bff"; align="center">忘記密碼</h2>
        <div class="messages">
        {%for message in messages%}
            <div class="alert alert-{{message.tags}}">{{message}}</div>
        {%endfor%}
        </div>
        <form method="POST" action=".">
            {%csrf_token%}
                <table>
                    {{password_form}}
                </table>
            <button type="submit" class="submit-btn">取得密碼資訊</button>
        </form>
    </div>
{%endblock%}
