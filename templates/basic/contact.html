{%extends 'basic/base.html'%}
{%block title%}聯絡我們{%endblock%}
{%block css%}
<style>
    .contact-container {
        max-width: 800px;
        margin: 50px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 40px 48px;
        font-family: 'Inter', sans-serif;
        color: #222222;
    }
    .contact-container h2 {
        font-weight: 700;
        font-size: 2.5rem;
        margin-bottom: 40px;
        border-bottom: 3px solid #007bff;
        padding-bottom: 12px;
        color: #007bff;
        text-align: center;
    }
    .contact-form input[type="text"],
    .contact-form input[type="email"],
    .contact-form textarea {
        width: 100%;
        padding: 12px;
        font-size: 1.5rem;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        margin-bottom: 20px;
        resize: vertical;
        transition: border-color 0.3s ease;
    }
    .contact-form button {
        background-color: #007bff;
        color: #fff;
        padding: 14px 30px;
        font-size: 1.1rem;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        width: 100%;
    }
    .contact-form button:hover {
        background-color: #0056b3;
    }
</style>
{%endblock%}
{%block content%}
	<div class="contact-container" role="main" aria-label="聯絡我們">
		{%for message in messages%}
			<div class="alert alert-{{message.tags}}">{{message}}</div>
		{%endfor%}
		<h2>聯絡我們</h2>
		<form class="contact-form" method="POST" action=".">
			{%csrf_token%}
			<label for="id_name">姓名</label>
			<input type="text" id="id_name" name="name" required placeholder="請輸入您的姓名">
			<label for="id_email">電子郵件</label>
			<input type="email" id="id_email" name="email" required placeholder="請輸入您的電子郵件">
			<label for="id_message">訊息內容</label>
			<textarea id="id_message" name="message" required placeholder="請輸入您的訊息"></textarea>
			<button type="submit">送出</button>
		</form>
	</div>
{%endblock%}
